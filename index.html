<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>APK World - Android Apps</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;

        }

            background: #111827;

            font-size: 32px;

            margin-top: 8px;

        }

        .search {
            max-width: 700px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .search input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;

            max-width: 900px;

            padding: 10px 15px 40px;

            margin: 15px 0;

        .app-card {

            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .app-icon {
            width: 80px;
            height: 80px;

            border-radius: 18px;
            overflow: hidden;

        .version {
            color: #777;

        .continue-btn {
            background: #16a34a;

            text-decoration: none;
            padding: 13px 20px;
            border: none;
            border-radius: 9px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: inline-block;
            text-align: center;
        }

        .download-btn:hover,
        .continue-btn:hover {
            background: #15803d;
        }

        #video-section {
            display: none;

</head>

<body>

    <header>
        <h1>APK WORLD</h1>
        <p>Android Apps & Downloads</p>
    </header>

    <div class="search">
        <input
            type="text"
            id="search"
            placeholder="Search apps..."
            oninput="searchApps()">
    </div>

    <main>
        <h2 class="heading">Popular Apps</h2>

        <div class="app-card" id="capcut">

            <div class="app-icon">
                <img src="capcut.png" alt="CapCut Logo">
            </div>

            <div class="app-info">
                <h2>CapCut</h2>
                <p>Video Editor for Android</p>
                <div class="version">Official Download</div>
            </div>

            <button
                class="download-btn"
                onclick="showVideo()">
                Download
            </button>

        </div>

        <section id="video-section">
            <h2>Watch Our YouTube Video</h2>

            <div class="video-frame">
                <iframe
                    id="youtube-frame"
                    title="YouTube video"
                    src=""
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen>
                </iframe>
            </div>

            <p id="continue-message">
                कृपया 3 सेकंड इंतज़ार करें...
            </p>

            <button
                id="continue-btn"
                class="continue-btn"
                onclick="continueDownload()"
                disabled>
                Continue Download
            </button>
        </section>
    </main>

    <footer>
        © 2026 APK World
    </footer>

    <script>
        // रोज़ सिर्फ इस लाइन में अपना YouTube वीडियो लिंक बदलें
        const youtubeVideoURL = "https://youtube.com/shorts/wTJxaZdt1uY?si=zawVCAiMzENNipna";

        // CapCut का आधिकारिक डाउनलोड पेज
        const downloadURL = "https://www.capcut.com/resource/capcut-apk-download";

        let countdownTimer = null;

        function searchApps() {
            const search = document
                .getElementById("search")
                .value.toLowerCase();

            const capcut = document.getElementById("capcut");

            capcut.style.display =
                "capcut".includes(search) ? "flex" : "none";
        }

        function showVideo() {
            const section = document.getElementById("video-section");
            const frame = document.getElementById("youtube-frame");
            const continueBtn = document.getElementById("continue-btn");
            const message = document.getElementById("continue-message");

            if (youtubeVideoURL.includes("YOUR_VIDEO_ID")) {
                alert("पहले कोड में अपना असली YouTube वीडियो लिंक डालें।");
                return;
            }

            const videoID = getYouTubeVideoID(youtubeVideoURL);

            if (!videoID) {
                alert("YouTube वीडियो का लिंक सही नहीं है।");
                return;
            }

            clearInterval(countdownTimer);

            frame.src =
                "https://www.youtube-nocookie.com/embed/" +
                encodeURIComponent(videoID);

            section.style.display = "block";
            continueBtn.disabled = true;
            continueBtn.textContent = "Continue Download";
            message.textContent = "कृपया 3 सेकंड इंतज़ार करें...";

            section.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });

            let seconds = 3;

            countdownTimer = setInterval(function () {
                seconds--;

                if (seconds <= 0) {
                    clearInterval(countdownTimer);
                    message.textContent =
                        "अब आप आगे बढ़ सकते हैं।";
                    continueBtn.disabled = false;
                } else {
                    message.textContent =
                        "कृपया " + seconds + " सेकंड इंतज़ार करें...";
                }
            }, 1000);
        }

        function getYouTubeVideoID(url) {
            try {
                const parsedURL = new URL(url);
                const host = parsedURL.hostname.replace(/^www\./, "");

                if (host === "youtu.be") {
                    return parsedURL.pathname.slice(1).split("/")[0];
                }

                if (
                    host === "youtube.com" ||
                    host === "m.youtube.com" ||
                    host === "youtube-nocookie.com"
                ) {
                    if (parsedURL.pathname === "/watch") {
                        return parsedURL.searchParams.get("v");
                    }

                    const parts = parsedURL.pathname.split("/");

                    if (
                        ["embed", "shorts", "live"].includes(parts[1])
                    ) {
                        return parts[2] || null;
                    }
                }
            } catch (error) {
                return null;
            }

            return null;
        }

        function continueDownload() {
            window.open(
                downloadURL,
                "_blank",
                "noopener,noreferrer"
            );
        }
    </script>

</body>
</html>
